version: 2
updates:
  # Root and app minor/patch version updates are handled by the PaulBot dependency
  # maintenance queue, which keeps manifests, both lockfiles, and the native shells
  # aligned (tests/unit/app-capacitor-native-config.test.js). A limit of 0 disables
  # version-update PRs here; Dependabot security updates are unaffected.
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    groups:
      root-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/app"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
    groups:
      app-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/functions"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      functions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/services/chatgpt-mcp"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      chatgpt-mcp-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
