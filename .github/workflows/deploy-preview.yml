name: deploy-preview

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string

# Pull-request-controlled code runs here, so this workflow has no repository
# permissions and receives no privileged secrets. Its only deploy input is an
# untrusted, staged Hosting artifact consumed by the trusted workflow_run job.
permissions: {}

concurrency:
  group: preview-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  build-preview-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact pull request head
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request number or exact head SHA." >&2
            exit 1
          fi
          git init .
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch --no-tags --prune --depth=1 origin "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"
          actual_head_sha="$(git rev-parse "refs/remotes/pull/$PR_NUMBER/head")"
          if [ "$actual_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "Pull request head changed before preview construction." >&2
            exit 1
          fi
          git checkout --detach --force "$actual_head_sha"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install app dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
          for attempt in 1 2 3; do
            npm ci --prefix apps/app && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient npm install failure for apps/app. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build React app
        run: npm run app:build

      - name: Stage untrusted Firebase Hosting bundle
        env:
          ALLPLAYS_APP_CHECK_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.APP_CHECK_PREVIEW_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          ALLPLAYS_APP_CHECK_ENFORCEMENT_READY: ${{ vars.APP_CHECK_ENFORCEMENT_READY }}
        run: node scripts/stage-pages-bundle.mjs "$RUNNER_TEMP/firebase-preview-site"

      - name: Upload staged Firebase Hosting bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-preview-hosting-bundle
          path: ${{ runner.temp }}/firebase-preview-site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
