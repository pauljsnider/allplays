name: mobile-build

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect mobile-relevant changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run — always building." >&2
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          else
            # New branch / unknown before-sha (e.g. force push) — fall back to
            # treating this as mobile-relevant so we don't silently skip a real
            # native build.
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:" >&2
          echo "$CHANGED" >&2

          # React source is already typechecked, tested, built, and smoke-tested
          # by pr-fast/preview-smoke. Rebuilding both native shells for an
          # ordinary apps/app/src change adds minutes without exercising a new
          # native boundary. Reserve these jobs for shell/config/plugin inputs.
          if echo "$CHANGED" | grep -Eq '^(\.github/workflows/mobile-build\.yml|android/|ios/|capacitor\.config\.(js|json|ts)|package\.json|package-lock\.json|apps/app/package\.json|apps/app/package-lock\.json)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  android-debug:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Record Android build start
        run: date -u +%s > "$RUNNER_TEMP/android-build-start-epoch"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Install app dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
          for attempt in 1 2 3; do
            npm ci --prefix apps/app && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient npm install failure for apps/app. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build React app
        run: npm run app:build:native

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          reset_gradle_dependency_cache() {
            rm -rf "$HOME/.gradle/caches/modules-2"
          }

          if ./gradlew :app:assembleDebug --stacktrace; then
            exit 0
          fi

          delay=20
          for attempt in 2 3; do
            echo "Initial Android build failed. Clearing dependency state before retry $attempt in ${delay}s..."
            ./gradlew --stop || true
            reset_gradle_dependency_cache
            sleep "$delay"
            if ./gradlew :app:assembleDebug --stacktrace --refresh-dependencies; then
              exit 0
            fi
            delay=$((delay * 2))
          done
          exit 1

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allplays-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Report Android build timing
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/android-build-start-epoch" ]; then
            echo "Android build timing unavailable because setup failed before timing started." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          start_epoch="$(cat "$RUNNER_TEMP/android-build-start-epoch")"
          end_epoch="$(date -u +%s)"
          echo "Android build duration: $((end_epoch - start_epoch))s" >> "$GITHUB_STEP_SUMMARY"

  ios-simulator:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-15

    steps:
      - name: Record iOS build start
        run: date -u +%s > "$RUNNER_TEMP/ios-build-start-epoch"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install app dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 10000
          npm config set fetch-retry-maxtimeout 60000
          for attempt in 1 2 3; do
            npm ci --prefix apps/app && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient npm install failure for apps/app. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build React app
        run: npm run app:build:native

      - name: Sync iOS project
        run: npm run prepare:ios-auth-spm && npx cap sync ios

      - name: Resolve iOS package dependencies
        run: |
          SWIFTPM_SOURCE_PACKAGES="$RUNNER_TEMP/swiftpm-source-packages"
          XCODE_DERIVED_DATA="$RUNNER_TEMP/xcode-derived-data"

          reset_swiftpm_package_state() {
            rm -rf \
              "$SWIFTPM_SOURCE_PACKAGES" \
              "$XCODE_DERIVED_DATA" \
              "$HOME/Library/Caches/org.swift.swiftpm" \
              "$HOME/Library/Developer/Xcode/DerivedData"/*/SourcePackages
          }

          run_with_retry() {
            attempt=1
            delay=20
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              echo "Attempt $attempt failed. Retrying in ${delay}s..."
              attempt=$((attempt + 1))
              reset_swiftpm_package_state
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          run_with_retry xcodebuild \
            -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath "$SWIFTPM_SOURCE_PACKAGES" \
            -derivedDataPath "$XCODE_DERIVED_DATA"

      - name: Build iOS simulator app
        run: |
          run_with_retry() {
            attempt=1
            delay=20
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                return 1
              fi
              echo "Attempt $attempt failed. Retrying in ${delay}s..."
              attempt=$((attempt + 1))
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          run_with_retry xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm-source-packages" \
            -derivedDataPath "$RUNNER_TEMP/xcode-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Report iOS build timing
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/ios-build-start-epoch" ]; then
            echo "iOS build timing unavailable because setup failed before timing started." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          start_epoch="$(cat "$RUNNER_TEMP/ios-build-start-epoch")"
          end_epoch="$(date -u +%s)"
          echo "iOS build duration: $((end_epoch - start_epoch))s" >> "$GITHUB_STEP_SUMMARY"

  # Single required status check with a stable name/context, regardless of
  # whether this PR's changes actually triggered a native build. Branch
  # protection requires this job (not the path-filtered android-debug/
  # ios-simulator jobs) so a PR that never touches mobile paths isn't stuck
  # waiting on a check that never runs, while a PR that does touch mobile
  # paths can't merge with a red native build (the gap this job closes).
  mobile-build:
    name: mobile-build
    needs: [changes, android-debug, ios-simulator]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check native build results
        env:
          ANDROID_RESULT: ${{ needs.android-debug.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          IOS_RESULT: ${{ needs.ios-simulator.result }}
          SHOULD_BUILD_MOBILE: ${{ needs.changes.outputs.mobile }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes job did not complete successfully ($CHANGES_RESULT) — failing closed instead of assuming no mobile-relevant changes."
            exit 1
          fi

          if [ "$SHOULD_BUILD_MOBILE" != "true" ]; then
            echo "No mobile-relevant changes — skipping native build requirement."
            exit 0
          fi

          if [ "$ANDROID_RESULT" != "success" ]; then
            echo "android-debug build did not succeed ($ANDROID_RESULT)."
            exit 1
          fi

          if [ "$IOS_RESULT" != "success" ]; then
            echo "ios-simulator build did not succeed ($IOS_RESULT)."
            exit 1
          fi

          echo "Native builds succeeded."
