name: deploy-prod

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install app dependencies
        run: npm ci --prefix apps/app

      - name: Run unit tests
        run: npm run test:unit:ci

      - name: Run authentication email functions coverage
        run: npm run test:functions:auth-email

  regression-guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase rules and deploy gates
        run: npm run ci:firebase-rules

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: python3 -m http.server 4173 >/tmp/allplays-prod-regression-guards.log 2>&1 &

      - name: Run roster/chat/media/replay regression smoke
        run: npm run test:smoke:team-fallback
        env:
          SMOKE_BASE_URL: http://127.0.0.1:4173

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-regression-guards-http-log
          path: /tmp/allplays-prod-regression-guards.log

  validate-production-smoke-config:
    needs: [unit-tests, regression-guards]
    runs-on: ubuntu-latest
    environment:
      name: production-smoke
    permissions: {}
    env:
      SMOKE_TEAM_ID: ${{ vars.SMOKE_TEAM_ID }}
      SMOKE_GAME_ID: ${{ vars.SMOKE_GAME_ID }}
      SMOKE_EVENT_ID: ${{ vars.SMOKE_EVENT_ID }}
      SMOKE_PLAYER_ID: ${{ vars.SMOKE_PLAYER_ID }}
      SMOKE_REGISTRATION_FORM_ID: ${{ vars.SMOKE_REGISTRATION_FORM_ID }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_STAFF_EMAIL: ${{ secrets.SMOKE_STAFF_EMAIL }}
      SMOKE_STAFF_PASSWORD: ${{ secrets.SMOKE_STAFF_PASSWORD }}
      SMOKE_PARENT_EMAIL: ${{ secrets.SMOKE_PARENT_EMAIL }}
      SMOKE_PARENT_PASSWORD: ${{ secrets.SMOKE_PARENT_PASSWORD }}
    steps:
      - name: Require production role-smoke fixtures before deployment
        shell: bash
        run: |
          set -euo pipefail
          required_names=(
            SMOKE_TEAM_ID
            SMOKE_GAME_ID
            SMOKE_EVENT_ID
            SMOKE_PLAYER_ID
            SMOKE_REGISTRATION_FORM_ID
            SMOKE_ADMIN_EMAIL
            SMOKE_ADMIN_PASSWORD
            SMOKE_STAFF_EMAIL
            SMOKE_STAFF_PASSWORD
            SMOKE_PARENT_EMAIL
            SMOKE_PARENT_PASSWORD
          )
          missing_names=()
          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing_names+=("$name")
            fi
          done
          if (( ${#missing_names[@]} > 0 )); then
            missing_csv="$(IFS=,; echo "${missing_names[*]}")"
            echo "::error title=Production smoke configuration incomplete::Missing protected configuration names: $missing_csv"
            exit 1
          fi

          admin_email="$(printf '%s' "$SMOKE_ADMIN_EMAIL" | tr '[:upper:]' '[:lower:]')"
          staff_email="$(printf '%s' "$SMOKE_STAFF_EMAIL" | tr '[:upper:]' '[:lower:]')"
          parent_email="$(printf '%s' "$SMOKE_PARENT_EMAIL" | tr '[:upper:]' '[:lower:]')"
          if [[ "$admin_email" == "$staff_email" ||
                "$admin_email" == "$parent_email" ||
                "$staff_email" == "$parent_email" ]]; then
            echo "::error title=Production smoke roles are not isolated::Admin, staff, and parent accounts must be distinct."
            exit 1
          fi

  prepare-deploy:
    needs: [unit-tests, regression-guards, validate-production-smoke-config]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      admin_user_search_backfill_needed: ${{ steps.firestore_config.outputs.admin_user_search_backfill_needed }}
      certificate_defaults_lockdown_needed: ${{ steps.firestore_config.outputs.certificate_defaults_lockdown_needed }}
      firestore_baseline_sha: ${{ steps.firestore_config.outputs.firestore_baseline_sha }}
      firestore_baseline_mode: ${{ steps.firestore_config.outputs.firestore_baseline_mode }}
      firestore_changed: ${{ steps.firestore_config.outputs.changed }}
      head_sha: ${{ steps.handoff_identity.outputs.head_sha }}
      registration_checkout_backfill_needed: ${{ steps.firestore_config.outputs.registration_checkout_backfill_needed }}
      storage_changed: ${{ steps.firestore_config.outputs.storage_changed }}
      team_fee_checkout_backfill_needed: ${{ steps.firestore_config.outputs.team_fee_checkout_backfill_needed }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install app dependencies
        run: npm ci --prefix apps/app

      - name: Build React app
        run: npm run app:build

      - name: Stage Firebase production bundle
        env:
          ALLPLAYS_APP_CHECK_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.APP_CHECK_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          ALLPLAYS_APP_CHECK_ENFORCEMENT_READY: ${{ vars.APP_CHECK_ENFORCEMENT_READY }}
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/firebase-production-ready"
          site_dir="$bundle_dir/site"
          config_file="$bundle_dir/firebase-prod.generated.json"
          mkdir -p "$bundle_dir"
          node scripts/stage-pages-bundle.mjs "$site_dir"
          node scripts/write-firebase-hosting-config.mjs "$site_dir" "$config_file"
          jq '.hosting.public = "site"' "$config_file" > "$config_file.tmp"
          mv "$config_file.tmp" "$config_file"
          node scripts/compact-firestore-rules.mjs firestore.rules "$bundle_dir/firestore.rules"
          compatibility_rules_source="$RUNNER_TEMP/firestore-certificate-defaults-compat.source.rules"
          node scripts/build-certificate-defaults-compat-rules.mjs \
            firestore.rules \
            "$compatibility_rules_source"
          node scripts/compact-firestore-rules.mjs \
            "$compatibility_rules_source" \
            "$bundle_dir/firestore-certificate-defaults-compat.rules"
          cp firestore.indexes.json storage.rules "$bundle_dir/"
          echo "FIREBASE_PRODUCTION_BUNDLE=$bundle_dir" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Detect Firebase rules changes
        id: firestore_config
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_branch="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "::error::Production deployment retries must target the current master branch."
              exit 1
            fi
            baseline_branch="master"
          fi
          last_success_sha=""
          last_success_run_json=""
          latest_prior_run_id=""
          latest_prior_run_json=""
          firestore_success_sha=""
          firestore_success_mode=""
          firestore_success_run_id=""
          lookup_succeeded="false"
          lookup_max_attempts=3
          for ((lookup_attempt = 1; lookup_attempt <= lookup_max_attempts; lookup_attempt += 1)); do
            if last_success_run_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs" \
              -f branch="$baseline_branch" \
              -f status=success \
              -F per_page=1)"; then
              last_success_sha="$(jq -r '.workflow_runs[0].head_sha // ""' <<< "$last_success_run_json")"
              lookup_succeeded="true"
              break
            fi

            if (( lookup_attempt < lookup_max_attempts )); then
              sleep $((5 * lookup_attempt))
            fi
          done

          if [[ "$lookup_succeeded" != "true" ]]; then
            echo "::warning::The successful production deploy lookup failed; forcing authorization rules-first ordering."
            echo "admin_user_search_backfill_needed=true" >> "$GITHUB_OUTPUT"
            echo "certificate_defaults_lockdown_needed=unknown" >> "$GITHUB_OUTPUT"
            echo "firestore_baseline_sha=unknown" >> "$GITHUB_OUTPUT"
            echo "firestore_baseline_mode=unknown" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "registration_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            echo "storage_changed=true" >> "$GITHUB_OUTPUT"
            echo "team_fee_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_history_lookup_succeeded="false"
          for ((lookup_attempt = 1; lookup_attempt <= lookup_max_attempts; lookup_attempt += 1)); do
            if latest_prior_run_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs" \
              -f branch="$baseline_branch" \
              -F per_page=20)"; then
              latest_prior_run_id="$(jq -r --arg current "$GITHUB_RUN_ID" '
                [.workflow_runs[] | select((.id | tostring) != $current)][0].id // ""
              ' <<< "$latest_prior_run_json")"
              run_history_lookup_succeeded="true"
              break
            fi
            if (( lookup_attempt < lookup_max_attempts )); then
              sleep $((5 * lookup_attempt))
            fi
          done
          if [[ "$run_history_lookup_succeeded" != "true" ]]; then
            echo "::warning::The production run history lookup failed; the active Firestore release mode is unknown."
            echo "admin_user_search_backfill_needed=true" >> "$GITHUB_OUTPUT"
            echo "certificate_defaults_lockdown_needed=unknown" >> "$GITHUB_OUTPUT"
            echo "firestore_baseline_sha=unknown" >> "$GITHUB_OUTPUT"
            echo "firestore_baseline_mode=unknown" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "registration_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            echo "storage_changed=true" >> "$GITHUB_OUTPUT"
            echo "team_fee_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          component_lookup_succeeded="false"
          component_marker_found="false"
          component_lookup_max_attempts=3
          for ((lookup_attempt = 1; lookup_attempt <= component_lookup_max_attempts; lookup_attempt += 1)); do
            component_lookup_succeeded="true"
            component_page=1
            while :; do
              deployments_json=""
              if ! deployments_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments" \
                -f environment=production-firestore \
                -F per_page=100 \
                -F page="$component_page")"; then
                component_lookup_succeeded="false"
                break
              fi
              if ! deployment_page_count="$(jq -r 'length' <<< "$deployments_json")" \
                || [[ ! "$deployment_page_count" =~ ^[0-9]+$ ]]; then
                component_lookup_succeeded="false"
                break
              fi
              while IFS=$'\t' read -r deployment_id deployment_sha; do
                [[ "$deployment_id" =~ ^[0-9]+$ ]] || continue
                [[ "$deployment_sha" =~ ^[0-9a-f]{40}$ ]] || continue
                deployment_status_json=""
                if ! deployment_status_json="$(gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                  -F per_page=100)"; then
                  component_lookup_succeeded="false"
                  break
                fi
                if ! deployment_success_json="$(jq -c \
                  '[.[] | select(.state == "success")][0] // empty' \
                  <<< "$deployment_status_json")"; then
                  component_lookup_succeeded="false"
                  break
                fi
                if [[ -n "$deployment_success_json" ]]; then
                  component_marker_found="true"
                  firestore_success_sha="$deployment_sha"
                  deployment_description="$(jq -r '.description // ""' <<< "$deployment_success_json")"
                  deployment_log_url="$(jq -r '.log_url // ""' <<< "$deployment_success_json")"
                  if [[ "$deployment_log_url" =~ /actions/runs/([0-9]+)$ ]]; then
                    firestore_success_run_id="${BASH_REMATCH[1]}"
                  fi
                  if [[ "$deployment_description" == *"compatibility rules"* ]]; then
                    firestore_success_mode="compatibility"
                  fi
                  break
                fi
              done < <(jq -r '.[] | [.id, .sha] | @tsv' <<< "$deployments_json")
              if [[ "$component_lookup_succeeded" != "true" ]] \
                || [[ "$component_marker_found" == "true" ]] \
                || (( deployment_page_count < 100 )); then
                break
              fi
              component_page=$((component_page + 1))
            done

            if [[ "$component_lookup_succeeded" == "true" ]]; then
              break
            fi

            if (( lookup_attempt < component_lookup_max_attempts )); then
              sleep $((5 * lookup_attempt))
            fi
          done

          if [[ "$component_lookup_succeeded" != "true" ]]; then
            echo "::warning::The Firestore component deployment lookup failed; the active release mode is unknown."
          elif [[ -z "$firestore_success_sha" ]]; then
            echo "::notice::No Firestore component deployment marker exists yet; using the last complete production deployment as the migration baseline."
            firestore_success_sha="$last_success_sha"
            firestore_success_mode="unmarked"
          fi
          if [[ "$firestore_success_sha" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$last_success_sha" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${firestore_success_sha}^{commit}" 2>/dev/null \
            && git cat-file -e "${last_success_sha}^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$firestore_success_sha" "$last_success_sha"; then
              if [[ "$firestore_success_sha" != "$last_success_sha" ]]; then
                if git diff --quiet "$firestore_success_sha" "$last_success_sha" -- \
                  firestore.rules firestore.indexes.json; then
                  echo "::notice::A newer unchanged complete production deployment supersedes the older Firestore component marker; advancing its SHA and forcing live mode classification."
                  firestore_success_sha="$last_success_sha"
                  if [[ "$firestore_success_mode" != "final" ]]; then
                    # The protected native-readiness gate can finalize the same
                    # source without a git diff. If that marker write failed, an
                    # older compatibility marker cannot prove the newer mode.
                    firestore_success_mode="ambiguous"
                  fi
                else
                  echo "::warning::A newer complete production deployment changed Firestore configuration without a component marker; retaining the older trusted baseline so active-source verification must resolve the state."
                fi
              fi
            elif ! git merge-base --is-ancestor "$last_success_sha" "$firestore_success_sha"; then
              echo "::warning::The Firestore component and complete production baselines diverged; forcing authorization rules-first ordering."
              firestore_success_sha=""
            fi
          fi
          if [[ "$component_lookup_succeeded" == "true" ]] \
            && [[ "$component_marker_found" == "true" ]] \
            && [[ "$firestore_success_mode" != "final" ]]; then
            if [[ ! "$latest_prior_run_id" =~ ^[0-9]+$ ]] \
              || [[ ! "$firestore_success_run_id" =~ ^[0-9]+$ ]] \
              || [[ "$firestore_success_run_id" != "$latest_prior_run_id" ]]; then
              echo "::notice::The latest prior production run identity is missing or did not produce the active component marker; forcing live mode classification."
              firestore_success_mode="ambiguous"
            fi
          fi

          if [[ ! "$last_success_sha" =~ ^[0-9a-f]{40}$ ]] \
            || ! git cat-file -e "${last_success_sha}^{commit}" 2>/dev/null; then
            if [[ ! "$last_success_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::warning::No valid successful production deploy baseline was found; conservatively enabling every non-Firestore migration."
            else
              echo "::warning::The last successful production deploy commit is unavailable locally; conservatively enabling every non-Firestore migration."
            fi
            echo "admin_user_search_backfill_needed=true" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "registration_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            echo "storage_changed=true" >> "$GITHUB_OUTPUT"
            echo "team_fee_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            if [[ "$component_lookup_succeeded" == "true" ]] \
              && [[ "$component_marker_found" == "true" ]] \
              && [[ "$firestore_success_sha" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "${firestore_success_sha}^{commit}" 2>/dev/null; then
              # Actions retention can remove every successful workflow run while
              # the durable component marker still identifies an exact Firestore
              # source. Keep that component baseline so the deploy job can resolve
              # an ambiguous mode against the live Rules API.
              if [[ -z "$firestore_success_mode" ]]; then
                if git show "${firestore_success_sha}:firestore.rules" \
                  | sed -n '/match \/settings\/{settingId}/,/^      }/p' \
                  | grep -Fq 'allow create, update, delete: if false;'; then
                  firestore_success_mode="final"
                else
                  firestore_success_mode="compatibility"
                fi
              fi
              echo "firestore_baseline_sha=$firestore_success_sha" >> "$GITHUB_OUTPUT"
              echo "firestore_baseline_mode=$firestore_success_mode" >> "$GITHUB_OUTPUT"
              if [[ "$firestore_success_mode" == "final" ]]; then
                echo "certificate_defaults_lockdown_needed=false" >> "$GITHUB_OUTPUT"
              else
                echo "certificate_defaults_lockdown_needed=true" >> "$GITHUB_OUTPUT"
              fi
              echo "::notice::Preserving the durable Firestore component baseline despite unavailable successful workflow history."
            else
              echo "certificate_defaults_lockdown_needed=unknown" >> "$GITHUB_OUTPUT"
              echo "firestore_baseline_sha=unknown" >> "$GITHUB_OUTPUT"
              echo "firestore_baseline_mode=unknown" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          else
            if [[ "$component_lookup_succeeded" == "true" ]] \
              && [[ "$firestore_success_sha" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "${firestore_success_sha}^{commit}" 2>/dev/null; then
              echo "firestore_baseline_sha=$firestore_success_sha" >> "$GITHUB_OUTPUT"
              if [[ "$firestore_success_mode" == "unmarked" ]]; then
                if git show "${firestore_success_sha}:firestore.rules" \
                  | sed -n '/match \/settings\/{settingId}/,/^      }/p' \
                  | grep -Fq 'allow create, update, delete: if false;'; then
                  # This source can deploy either its generated compatibility
                  # variant or final denial. Without a component marker, only
                  # the live exact-source classifier can resolve which is active.
                  firestore_success_mode="ambiguous"
                else
                  firestore_success_mode="compatibility"
                fi
              elif [[ -z "$firestore_success_mode" ]]; then
                if git show "${firestore_success_sha}:firestore.rules" \
                  | sed -n '/match \/settings\/{settingId}/,/^      }/p' \
                  | grep -Fq 'allow create, update, delete: if false;'; then
                  firestore_success_mode="final"
                else
                  firestore_success_mode="compatibility"
                fi
              fi
              echo "firestore_baseline_mode=$firestore_success_mode" >> "$GITHUB_OUTPUT"
            else
              echo "firestore_baseline_sha=unknown" >> "$GITHUB_OUTPUT"
              echo "firestore_baseline_mode=unknown" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$component_lookup_succeeded" != "true" ]]; then
              echo "certificate_defaults_lockdown_needed=unknown" >> "$GITHUB_OUTPUT"
            elif [[ "$firestore_success_mode" == "final" ]]; then
              echo "certificate_defaults_lockdown_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "certificate_defaults_lockdown_needed=true" >> "$GITHUB_OUTPUT"
            fi
            if git diff --quiet "$last_success_sha" "$GITHUB_SHA" -- \
              _migration/backfill-admin-user-search-index.js \
              functions/admin-user-search-index-core.cjs; then
              echo "admin_user_search_backfill_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "admin_user_search_backfill_needed=true" >> "$GITHUB_OUTPUT"
            fi
            if git diff --quiet "$last_success_sha" "$GITHUB_SHA" -- \
              _migration/backfill-team-fee-checkout-attempts.js \
              _migration/firebase-admin-credential.mjs \
              functions/team-fees-core.cjs; then
              echo "team_fee_checkout_backfill_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "team_fee_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            fi
            if git diff --quiet "$last_success_sha" "$GITHUB_SHA" -- \
              _migration/backfill-registration-checkout-attempts.js \
              _migration/firebase-admin-credential.mjs \
              functions/registration-payment-webhook-core.cjs; then
              echo "registration_checkout_backfill_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "registration_checkout_backfill_needed=true" >> "$GITHUB_OUTPUT"
            fi
            if [[ ! "$firestore_success_sha" =~ ^[0-9a-f]{40}$ ]] \
              || ! git cat-file -e "${firestore_success_sha}^{commit}" 2>/dev/null; then
              echo "::warning::The Firestore component deployment commit is unavailable locally; forcing authorization rules-first ordering."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif [[ "$firestore_success_mode" == "ambiguous" ]]; then
              echo "::warning::The Firestore baseline has no component mode marker; forcing live exact-source classification."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            elif git diff --quiet "$firestore_success_sha" "$GITHUB_SHA" -- firestore.rules firestore.indexes.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            if git diff --quiet "$last_success_sha" "$GITHUB_SHA" -- storage.rules; then
              echo "storage_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "storage_changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Stage exact Firestore baseline variants
        env:
          FIRESTORE_BASELINE_MODE: ${{ steps.firestore_config.outputs.firestore_baseline_mode }}
          FIRESTORE_BASELINE_SHA: ${{ steps.firestore_config.outputs.firestore_baseline_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$FIRESTORE_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || ! git cat-file -e "${FIRESTORE_BASELINE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::No trusted Firestore baseline is available for active-source classification."
            exit 0
          fi

          baseline_checkout="$(mktemp -d "$RUNNER_TEMP/firestore-baseline-checkout.XXXXXX")"
          git archive "$FIRESTORE_BASELINE_SHA" | tar -x -C "$baseline_checkout"
          baseline_source="$baseline_checkout/firestore.rules"
          baseline_compatibility_source="$RUNNER_TEMP/firestore-baseline-compat.source.rules"
          baseline_compactor="$baseline_checkout/scripts/compact-firestore-rules.mjs"
          baseline_transformer="$baseline_checkout/scripts/build-certificate-defaults-compat-rules.mjs"
          if [[ ! -f "$baseline_source" || ! -f "$baseline_compactor" ]]; then
            echo "The trusted Firestore baseline does not contain its exact rules compactor." >&2
            exit 1
          fi
          baseline_node_major="$(awk '/node-version:/ { gsub(/[^0-9]/, "", $2); print $2; exit }' "$baseline_checkout/.github/workflows/deploy-prod.yml")"
          current_node_major="$(node -p 'process.versions.node.split(`.`)[0]')"
          if [[ ! "$baseline_node_major" =~ ^[0-9]+$ || "$baseline_node_major" != "$current_node_major" ]]; then
            echo "The trusted Firestore baseline runtime is unavailable in this deployment job." >&2
            exit 1
          fi
          (
            cd "$baseline_checkout"
            node "scripts/compact-firestore-rules.mjs" \
            "$baseline_source" \
            "$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline.rules"
          )

          if [[ "$FIRESTORE_BASELINE_MODE" != "final" \
            && "$FIRESTORE_BASELINE_MODE" != "compatibility" \
            && "$FIRESTORE_BASELINE_MODE" != "ambiguous" ]]; then
            echo "The trusted Firestore baseline does not have a recognized release mode." >&2
            exit 1
          fi
          if [[ -f "$baseline_transformer" ]]; then
            (
              cd "$baseline_checkout"
              node "scripts/build-certificate-defaults-compat-rules.mjs" \
                "$baseline_source" "$baseline_compatibility_source"
              node "scripts/compact-firestore-rules.mjs" \
                "$baseline_compatibility_source" \
                "$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline-compat.rules"
            )
          else
            # Pre-migration baselines already contain the legacy direct-write
            # block and cannot be transformed from the newer server-only form.
            cp "$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline.rules" \
              "$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline-compat.rules"
            if [[ "$FIRESTORE_BASELINE_MODE" == "final" ]]; then
              echo "A trusted final component marker cannot reference legacy client-writable certificate defaults rules." >&2
              exit 1
            fi
            # The two exact artifacts are identical for a legacy writable
            # source. Label that source compatibility so the active classifier
            # never mistakes the first matching candidate for final denial.
            FIRESTORE_BASELINE_MODE="compatibility"
          fi
          printf '%s\n' "$FIRESTORE_BASELINE_MODE" > "$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline.mode"

      - name: Archive installed Functions runtime into trusted handoff
        run: |
          set -euo pipefail
          # actions/upload-artifact intentionally normalizes file modes and
          # does not preserve symlinks. Keep the installed Functions runtime
          # inside tar so npm executable bits and .bin links survive handoff.
          tar --format=posix \
            -cf "$FIREBASE_PRODUCTION_BUNDLE/functions-runtime.tar" \
            functions
          mkdir -p "$FIREBASE_PRODUCTION_BUNDLE/context"
          mkdir -p "$FIREBASE_PRODUCTION_BUNDLE/_migration"
          cp _migration/backfill-admin-user-search-index.js \
            "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-admin-user-search-index.mjs"
          cp _migration/backfill-legacy-team-owner-ids.js \
            "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-legacy-team-owner-ids.mjs"
          cp _migration/backfill-team-fee-checkout-attempts.js \
            "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-team-fee-checkout-attempts.mjs"
          cp _migration/backfill-registration-checkout-attempts.js \
            "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-registration-checkout-attempts.mjs"
          cp _migration/backfill-certificate-legacy-signature-inventory.js \
            "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-certificate-legacy-signature-inventory.mjs"
          cp _migration/firebase-admin-credential.mjs \
            "$FIREBASE_PRODUCTION_BUNDLE/_migration/firebase-admin-credential.mjs"
          cp scripts/extract-production-functions-handoff.py "$FIREBASE_PRODUCTION_BUNDLE/context/"

      - name: Install isolated Firebase deploy CLI without OIDC or lifecycle scripts
        run: |
          set -euo pipefail
          npm install \
            --prefix "$FIREBASE_PRODUCTION_BUNDLE/firebase-cli" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=false \
            firebase-tools@14.25.0
          node "$FIREBASE_PRODUCTION_BUNDLE/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js" --version

      - name: Bind handoff to exact production commit
        id: handoff_identity
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > "$FIREBASE_PRODUCTION_BUNDLE/head-sha"
          echo "head_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload trusted production deploy handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firebase-production-trusted-ready
          path: ${{ runner.temp }}/firebase-production-ready
          if-no-files-found: error
          include-hidden-files: true
          # Keep the trusted, credential-free handoff available across
          # production approval queues and environment wait timers.
          retention-days: 30

  deploy:
    needs: prepare-deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
      deployments: write
      id-token: write

    steps:
      # Only the fixed artifact produced by the no-OIDC preparation job enters
      # this job. No checkout, dependency install, build, or lifecycle script
      # shares the production identity boundary.
      - name: Download trusted production deploy handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firebase-production-trusted-ready
          path: ${{ runner.temp }}/firebase-production-ready

      - name: Validate and extract trusted production handoff before OIDC
        env:
          ADMIN_USER_SEARCH_BACKFILL_NEEDED: ${{ needs.prepare-deploy.outputs.admin_user_search_backfill_needed }}
          CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY: ${{ vars.CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY }}
          CERTIFICATE_DEFAULTS_LOCKDOWN_NEEDED: ${{ needs.prepare-deploy.outputs.certificate_defaults_lockdown_needed }}
          FIRESTORE_CONFIG_CHANGED: ${{ needs.prepare-deploy.outputs.firestore_changed }}
          PREPARED_HEAD_SHA: ${{ needs.prepare-deploy.outputs.head_sha }}
          REGISTRATION_CHECKOUT_BACKFILL_NEEDED: ${{ needs.prepare-deploy.outputs.registration_checkout_backfill_needed }}
          STORAGE_RULES_CHANGED: ${{ needs.prepare-deploy.outputs.storage_changed }}
          TEAM_FEE_CHECKOUT_BACKFILL_NEEDED: ${{ needs.prepare-deploy.outputs.team_fee_checkout_backfill_needed }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/firebase-production-ready"
          if [[ "$PREPARED_HEAD_SHA" != "$GITHUB_SHA" ]] || [[ ! "$PREPARED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Production handoff commit does not match this workflow run." >&2
            exit 1
          fi
          if [[ "$FIRESTORE_CONFIG_CHANGED" != "true" && "$FIRESTORE_CONFIG_CHANGED" != "false" ]]; then
            echo "Invalid Firestore change state." >&2
            exit 1
          fi
          if [[ "$CERTIFICATE_DEFAULTS_LOCKDOWN_NEEDED" != "true" && "$CERTIFICATE_DEFAULTS_LOCKDOWN_NEEDED" != "false" ]]; then
            echo "Invalid certificate defaults lockdown state." >&2
            exit 1
          fi
          if [[ -n "$CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY" \
            && "$CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY" != "true" \
            && "$CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY" != "false" ]]; then
            echo "Invalid certificate defaults native migration readiness state." >&2
            exit 1
          fi
          if [[ "$ADMIN_USER_SEARCH_BACKFILL_NEEDED" != "true" && "$ADMIN_USER_SEARCH_BACKFILL_NEEDED" != "false" ]]; then
            echo "Invalid admin user search backfill state." >&2
            exit 1
          fi
          if [[ "$TEAM_FEE_CHECKOUT_BACKFILL_NEEDED" != "true" && "$TEAM_FEE_CHECKOUT_BACKFILL_NEEDED" != "false" ]]; then
            echo "Invalid team fee checkout backfill state." >&2
            exit 1
          fi
          if [[ "$REGISTRATION_CHECKOUT_BACKFILL_NEEDED" != "true" && "$REGISTRATION_CHECKOUT_BACKFILL_NEEDED" != "false" ]]; then
            echo "Invalid registration checkout backfill state." >&2
            exit 1
          fi
          if [[ "$STORAGE_RULES_CHANGED" != "true" && "$STORAGE_RULES_CHANGED" != "false" ]]; then
            echo "Invalid Storage change state." >&2
            exit 1
          fi
          grep -Fxq "$GITHUB_SHA" "$bundle/head-sha"
          test -d "$bundle/site"
          test -f "$bundle/functions-runtime.tar"
          test -f "$bundle/context/extract-production-functions-handoff.py"
          test ! -L "$bundle/context/extract-production-functions-handoff.py"
          test -f "$bundle/_migration/backfill-admin-user-search-index.mjs"
          test ! -L "$bundle/_migration/backfill-admin-user-search-index.mjs"
          test -f "$bundle/_migration/backfill-legacy-team-owner-ids.mjs"
          test ! -L "$bundle/_migration/backfill-legacy-team-owner-ids.mjs"
          test -f "$bundle/_migration/backfill-team-fee-checkout-attempts.mjs"
          test ! -L "$bundle/_migration/backfill-team-fee-checkout-attempts.mjs"
          test -f "$bundle/_migration/backfill-registration-checkout-attempts.mjs"
          test ! -L "$bundle/_migration/backfill-registration-checkout-attempts.mjs"
          test -f "$bundle/_migration/backfill-certificate-legacy-signature-inventory.mjs"
          test ! -L "$bundle/_migration/backfill-certificate-legacy-signature-inventory.mjs"
          test -f "$bundle/_migration/firebase-admin-credential.mjs"
          test ! -L "$bundle/_migration/firebase-admin-credential.mjs"
          test -f "$bundle/firestore.rules"
          test -f "$bundle/firestore-certificate-defaults-compat.rules"
          test ! -L "$bundle/firestore-certificate-defaults-compat.rules"
          test -f "$bundle/firestore-baseline.rules"
          test ! -L "$bundle/firestore-baseline.rules"
          test -f "$bundle/firestore-baseline-compat.rules"
          test ! -L "$bundle/firestore-baseline-compat.rules"
          test -f "$bundle/firestore-baseline.mode"
          test ! -L "$bundle/firestore-baseline.mode"
          grep -Eq '^(ambiguous|compatibility|final)$' "$bundle/firestore-baseline.mode"
          test -f "$bundle/firestore.indexes.json"
          test -f "$bundle/storage.rules"
          test -f "$bundle/firebase-prod.generated.json"
          test -f "$bundle/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          jq -e '.hosting.public == "site" and .hosting.site == "game-flow-c6311" and .functions.source == "functions"' "$bundle/firebase-prod.generated.json" >/dev/null
          expected_extractor_sha256='0acd0a7041df6ffc53befb388c6591efd149d4f82d4cfed2ea37d7349394165f'
          printf '%s  %s\n' \
            "$expected_extractor_sha256" \
            "$bundle/context/extract-production-functions-handoff.py" \
            | sha256sum --check --strict -
          python3 "$bundle/context/extract-production-functions-handoff.py" \
            "$bundle/functions-runtime.tar" \
            "$bundle"
          ln -s functions/node_modules "$bundle/node_modules"
          echo "FIREBASE_PRODUCTION_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Authenticate legacy owner lifecycle deploy through exact-workflow OIDC
        id: google_auth_owner_lifecycle
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: game-flow-c6311
          create_credentials_file: true
          cleanup_credentials: true

      - name: Deploy legacy owner Auth lifecycle compatibility
        timeout-minutes: 4
        run: |
          set -euo pipefail
          firebase_cli="$FIREBASE_PRODUCTION_BUNDLE/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          firebase_config="$FIREBASE_PRODUCTION_BUNDLE/firebase-prod.generated.json"
          (
            cd "$FIREBASE_PRODUCTION_BUNDLE"
            node "$firebase_cli" deploy --only functions:syncLegacyTeamOwnershipOnAuthCreate --project game-flow-c6311 --config "$firebase_config" --non-interactive --force
          )

      - name: Remove legacy owner lifecycle deploy credential
        env:
          GOOGLE_CREDENTIAL_FILE: ${{ steps.google_auth_owner_lifecycle.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_CREDENTIAL_FILE" ]]; then
            rm -f -- "$GOOGLE_CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Authenticate legacy owner migration through exact-workflow OIDC
        id: google_auth_owner_migration
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: game-flow-c6311
          create_credentials_file: true
          cleanup_credentials: true
          token_format: access_token

      - name: Canonicalize legacy team owners before authorization lockdown
        run: node "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-legacy-team-owner-ids.mjs" --apply
        env:
          FIREBASE_PROJECT_ID: game-flow-c6311
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth_owner_migration.outputs.access_token }}

      - name: Remove legacy owner migration credential
        env:
          GOOGLE_CREDENTIAL_FILE: ${{ steps.google_auth_owner_migration.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_CREDENTIAL_FILE" ]]; then
            rm -f -- "$GOOGLE_CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Authenticate Storage deploy through exact-workflow OIDC
        id: google_auth_storage
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: game-flow-c6311
          create_credentials_file: true
          cleanup_credentials: true

      - name: Deploy Firebase Storage rules when available
        timeout-minutes: 4
        shell: bash
        env:
          STORAGE_RULES_CHANGED: ${{ needs.prepare-deploy.outputs.storage_changed }}
        run: |
          set -euo pipefail
          firebase_cli="$FIREBASE_PRODUCTION_BUNDLE/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          firebase_config="$FIREBASE_PRODUCTION_BUNDLE/firebase-prod.generated.json"
          storage_log="$RUNNER_TEMP/firebase-storage-deploy.log"
          set +e
          (
            cd "$FIREBASE_PRODUCTION_BUNDLE"
            node "$firebase_cli" deploy --only storage --project game-flow-c6311 --config "$firebase_config" --non-interactive
          ) 2>&1 | tee "$storage_log"
          storage_status="${PIPESTATUS[0]}"
          set -e

          if (( storage_status == 0 )); then
            exit 0
          fi

          storage_plain_log="$RUNNER_TEMP/firebase-storage-deploy.plain.log"
          sed -E 's/\x1B\[[0-9;]*[[:alpha:]]//g' "$storage_log" > "$storage_plain_log"
          storage_not_configured="Firebase Storage has not been set up on project 'game-flow-c6311'"
          if grep -Fq "$storage_not_configured" "$storage_plain_log" && [[ "$STORAGE_RULES_CHANGED" != "true" ]]; then
            echo "::warning::Firebase Storage is not initialized; no Storage surface exists yet. Rules were unchanged, so the rest of production deployment can continue."
            echo "### Firebase Storage rules" >> "$GITHUB_STEP_SUMMARY"
            echo "Skipped because Storage is not initialized and storage.rules was unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -Fq "$storage_not_configured" "$storage_plain_log"; then
            echo "::error::storage.rules changed, but Firebase Storage is not initialized. Refusing to deploy other production changes with stale Storage authorization rules."
          fi
          exit "$storage_status"

      - name: Remove Storage deploy credential
        if: always()
        env:
          GOOGLE_CREDENTIAL_FILE: ${{ steps.google_auth_storage.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_CREDENTIAL_FILE" ]]; then
            rm -f -- "$GOOGLE_CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

      - name: Authenticate production deploy through exact-workflow OIDC
        id: google_auth_production
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: game-flow-c6311
          create_credentials_file: true
          cleanup_credentials: true
          token_format: access_token

      - name: Deploy Firebase production
        # Updating the full first-generation Functions fleet routinely takes
        # longer than four minutes. Leave enough room for one deployment plus
        # the bounded transient retries above without allowing an unbounded job.
        timeout-minutes: 20
        shell: bash
        env:
          ADMIN_USER_SEARCH_BACKFILL_NEEDED: ${{ needs.prepare-deploy.outputs.admin_user_search_backfill_needed }}
          CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY: ${{ vars.CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY }}
          CERTIFICATE_DEFAULTS_LOCKDOWN_NEEDED: ${{ needs.prepare-deploy.outputs.certificate_defaults_lockdown_needed }}
          FIRESTORE_CONFIG_CHANGED: ${{ needs.prepare-deploy.outputs.firestore_changed }}
          GH_TOKEN: ${{ github.token }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth_production.outputs.access_token }}
          REGISTRATION_CHECKOUT_BACKFILL_NEEDED: ${{ needs.prepare-deploy.outputs.registration_checkout_backfill_needed }}
          TEAM_FEE_CHECKOUT_BACKFILL_NEEDED: ${{ needs.prepare-deploy.outputs.team_fee_checkout_backfill_needed }}
        run: |
          set -euo pipefail
          firebase_cli="$FIREBASE_PRODUCTION_BUNDLE/firebase-cli/node_modules/firebase-tools/lib/bin/firebase.js"
          firebase_config="$FIREBASE_PRODUCTION_BUNDLE/firebase-prod.generated.json"
          firestore_indexes_config="$FIREBASE_PRODUCTION_BUNDLE/firebase-indexes.generated.json"
          final_firestore_rules="$FIREBASE_PRODUCTION_BUNDLE/firestore.rules"
          compatibility_firestore_rules="$FIREBASE_PRODUCTION_BUNDLE/firestore-certificate-defaults-compat.rules"
          baseline_firestore_rules="$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline.rules"
          baseline_compatibility_firestore_rules="$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline-compat.rules"
          baseline_firestore_mode="$(< "$FIREBASE_PRODUCTION_BUNDLE/firestore-baseline.mode")"
          native_callable_ready="${CERTIFICATE_DEFAULTS_NATIVE_CALLABLE_READY:-false}"
          finalize_firestore_rules="false"
          firestore_component_description="Firestore rules and indexes are current at ${GITHUB_SHA}."
          if [[ "$baseline_firestore_mode" == "compatibility" ]]; then
            firestore_component_description="Firestore compatibility rules at ${GITHUB_SHA}; packaged native clients still use direct writes."
          fi
          transient_pattern='(^|[^[:alnum:]])(429|500|502|503|504)([^[:alnum:]]|$)|HTTP Error:[[:space:]]*409,[[:space:]]*Requested entity already exists|service[[:space:]_-]+unavailable|econnreset|connection[[:space:]_-]+reset|network[[:space:]_-]+reset|etimedout|timed[[:space:]_-]+out|timeout'
          retry_enabled_inventory_producer_target="functions:indexCertificateLegacySignaturesOnDefaultsWrite"
          retry_enabled_cleanup_compatibility_target="functions:cleanupCertificateSignature"
          retry_enabled_function_targets="functions:indexCertificateLegacySignaturesOnDefaultsWrite,functions:processAccountDeletionRequest,functions:queueParentInviteEmail,functions:reconcileLegacyTeamOwnership,functions:syncLegacyTeamOwnershipOnAuthCreate,functions:syncPublicUserProfileOnUserWrite,functions:syncPublicUserProfilesOnTeamWrite,functions:syncTeamOwnerAccessOnCreate"
          # The Rules API compiled this exact compatibility source after the
          # f87957ae2 deployment verified the immutable create response. The
          # service later returned compiler-canonicalized source (including
          # renamed helper functions), so preserve this one exact recovery
          # proof while all newly created rulesets carry their source digest.
          certificate_compatibility_recovery_ruleset="projects/game-flow-c6311/rulesets/6da601e4-12e3-420a-8db3-907153c712c7"
          certificate_compatibility_recovery_source_sha256="825ec3d3a56a067dc5c80c0e6e6f3fc1ceba2b09b249e0605889dc3d964dc6f2"
          certificate_compatibility_recovery_canonical_sha256="0334471987fba5fbb95f7acf49382e3e412849f02cb2ed333f87249f1674b4de"

          if ! jq -e '
            .firestore.rules == "firestore.rules"
            and .firestore.indexes == "firestore.indexes.json"
          ' "$firebase_config" >/dev/null; then
            echo "The trusted production config does not contain the exact Firestore rules and indexes paths." >&2
            exit 1
          fi
          jq 'del(.firestore.rules)' "$firebase_config" > "$firestore_indexes_config"
          if ! jq -e '
            .firestore.indexes == "firestore.indexes.json"
            and (.firestore | has("rules") | not)
          ' "$firestore_indexes_config" >/dev/null; then
            echo "The indexes-only Firebase config still contains a Firestore rules target." >&2
            exit 1
          fi

          firestore_source_sha256() {
            sha256sum "$1" | awk '{print $1}'
          }

          firestore_source_fingerprint() {
            openssl dgst -sha256 -binary "$1" | base64 | tr -d '\n'
          }

          firestore_rules_api_error() {
            local operation="$1"
            local curl_status="$2"
            local http_status="$3"
            local response_file="$4"
            local api_status api_message
            api_status="$(jq -r '.error.status // "unknown"' "$response_file" 2>/dev/null || true)"
            api_message="$(jq -r '.error.message // "no structured error response"' "$response_file" 2>/dev/null || true)"
            echo "${operation} failed (curl=${curl_status}, HTTP=${http_status}, status=${api_status}): ${api_message}" >&2
          }

          firestore_ruleset_source_matches() {
            local ruleset_json="$1"
            local ruleset_name="$2"
            local expected_rules_source="$3"
            local remote_rules_b64 remote_fingerprint local_rules_b64 local_fingerprint
            local remote_rules_sha256 local_rules_sha256
            remote_rules_b64="$(
              jq -er '
                (.source.files // [])
                | if length == 1 and .[0].name == "firestore.rules"
                  then (.[0].content | @base64)
                  else error("expected exactly one firestore.rules source file")
                  end
              ' "$ruleset_json" 2>/dev/null || true
            )"
            remote_fingerprint="$(
              jq -er '
                (.source.files // [])
                | if length == 1 and .[0].name == "firestore.rules"
                  then (.[0].fingerprint // "")
                  else error("expected exactly one firestore.rules source file")
                  end
              ' "$ruleset_json" 2>/dev/null || true
            )"
            [[ -n "$remote_rules_b64" ]] || return 2
            local_rules_b64="$(base64 < "$expected_rules_source" | tr -d '\n')"
            local_fingerprint="$(firestore_source_fingerprint "$expected_rules_source")"
            if [[ "$remote_rules_b64" == "$local_rules_b64" ]] \
              || [[ -n "$remote_fingerprint" && "$remote_fingerprint" == "$local_fingerprint" ]]; then
              return 0
            fi

            # One immutable ruleset predates source fingerprints. Accept it
            # only when both the expected repository source and the complete
            # compiler-canonicalized remote source match their pinned digests.
            [[ "$ruleset_name" == "$certificate_compatibility_recovery_ruleset" ]] || return 1
            local_rules_sha256="$(firestore_source_sha256 "$expected_rules_source")"
            [[ "$local_rules_sha256" == "$certificate_compatibility_recovery_source_sha256" ]] || return 1
            remote_rules_sha256="$(printf '%s' "$remote_rules_b64" | base64 --decode | sha256sum | awk '{print $1}')"
            [[ "$remote_rules_sha256" == "$certificate_compatibility_recovery_canonical_sha256" ]]
          }

          verify_active_firestore_rules() {
            local expected_rules_source="${1:-$final_firestore_rules}"
            local release_json ruleset_json ruleset_name
            release_json="$(mktemp "$RUNNER_TEMP/firestore-release.XXXXXX.json")"
            ruleset_json="$(mktemp "$RUNNER_TEMP/firestore-ruleset.XXXXXX.json")"

            if ! curl --silent --show-error --fail \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer ${GOOGLE_OAUTH_ACCESS_TOKEN}" \
              "https://firebaserules.googleapis.com/v1/projects/game-flow-c6311/releases/cloud.firestore" \
              > "$release_json"; then
              rm -f "$release_json" "$ruleset_json"
              return 2
            fi

            ruleset_name="$(jq -er '.rulesetName' "$release_json" 2>/dev/null || true)"
            if [[ ! "$ruleset_name" =~ ^projects/game-flow-c6311/rulesets/[A-Za-z0-9_-]+$ ]]; then
              rm -f "$release_json" "$ruleset_json"
              return 2
            fi

            if ! curl --silent --show-error --fail \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer ${GOOGLE_OAUTH_ACCESS_TOKEN}" \
              "https://firebaserules.googleapis.com/v1/${ruleset_name}" \
              > "$ruleset_json"; then
              rm -f "$release_json" "$ruleset_json"
              return 2
            fi

            local source_match_status
            if firestore_ruleset_source_matches "$ruleset_json" "$ruleset_name" "$expected_rules_source"; then
              rm -f "$release_json" "$ruleset_json"
              return 0
            else
              source_match_status="$?"
            fi
            rm -f "$release_json" "$ruleset_json"
            return "$source_match_status"
          }

          find_recent_matching_firestore_ruleset() {
            local expected_rules_source="${1:-$final_firestore_rules}"
            local list_file ruleset_file ruleset_name
            local attempt curl_status http_status list_succeeded
            list_file="$(mktemp "$RUNNER_TEMP/firestore-rulesets.XXXXXX.json")"
            ruleset_file="$(mktemp "$RUNNER_TEMP/firestore-ruleset-candidate.XXXXXX.json")"
            list_succeeded="false"

            for attempt in 1 2 3; do
              set +e
              http_status="$(
                curl --silent --show-error \
                  --connect-timeout 10 \
                  --max-time 30 \
                  --output "$list_file" \
                  --write-out '%{http_code}' \
                  --header "Authorization: Bearer ${GOOGLE_OAUTH_ACCESS_TOKEN}" \
                  "https://firebaserules.googleapis.com/v1/projects/game-flow-c6311/rulesets?pageSize=20"
              )"
              curl_status="$?"
              set -e
              if (( curl_status == 0 )) && [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
                list_succeeded="true"
                break
              fi
              if (( curl_status == 0 )) && [[ ! "$http_status" =~ ^(408|429|500|502|503|504)$ ]]; then
                break
              fi
              if (( attempt < 3 )); then
                sleep $((10 * attempt))
              fi
            done

            if [[ "$list_succeeded" != "true" ]]; then
              rm -f "$list_file" "$ruleset_file"
              return 1
            fi

            while IFS= read -r ruleset_name; do
              [[ "$ruleset_name" =~ ^projects/game-flow-c6311/rulesets/[A-Za-z0-9_-]+$ ]] || continue
              for attempt in 1 2 3; do
                set +e
                http_status="$(
                  curl --silent --show-error \
                    --connect-timeout 10 \
                    --max-time 30 \
                    --output "$ruleset_file" \
                    --write-out '%{http_code}' \
                    --header "Authorization: Bearer ${GOOGLE_OAUTH_ACCESS_TOKEN}" \
                    "https://firebaserules.googleapis.com/v1/${ruleset_name}"
                )"
                curl_status="$?"
                set -e
                if (( curl_status == 0 )) && [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
                  break
                fi
                if (( curl_status == 0 )) && [[ ! "$http_status" =~ ^(408|429|500|502|503|504)$ ]]; then
                  break
                fi
                if (( attempt < 3 )); then
                  sleep $((5 * attempt))
                fi
              done
              if (( curl_status != 0 )) || [[ ! "$http_status" =~ ^2[0-9][0-9]$ ]]; then
                continue
              fi
              if firestore_ruleset_source_matches "$ruleset_file" "$ruleset_name" "$expected_rules_source"; then
                rm -f "$list_file" "$ruleset_file"
                printf '%s\n' "$ruleset_name"
                return 0
              fi
            done < <(
              jq -r '
                (.rulesets // [])
                | sort_by(.createTime)
                | reverse
                | .[].name
              ' "$list_file"
            )

            rm -f "$list_file" "$ruleset_file"
            return 1
          }

          create_firestore_ruleset_with_retry() {
            local expected_rules_source="${1:-$final_firestore_rules}"
            local payload_file response_file ruleset_name local_rules_b64 created_rules_b64
            local local_fingerprint created_fingerprint
            local attempt curl_status http_status retry_delay_seconds
            payload_file="$(mktemp "$RUNNER_TEMP/firestore-ruleset-create.XXXXXX.json")"
            response_file="$(mktemp "$RUNNER_TEMP/firestore-ruleset-create-response.XXXXXX.json")"
            local_rules_b64="$(base64 < "$expected_rules_source" | tr -d '\n')"
            local_fingerprint="$(firestore_source_fingerprint "$expected_rules_source")"
            jq -n \
              --rawfile rules_source "$expected_rules_source" \
              --arg rules_fingerprint "$local_fingerprint" \
              '{
                source:{
                  files:[
                    {
                      name:"firestore.rules",
                      content:$rules_source,
                      fingerprint:$rules_fingerprint
                    }
                  ]
                }
              }' > "$payload_file"

            for attempt in 1 2 3; do
              set +e
              http_status="$(
                curl --silent --show-error \
                  --connect-timeout 10 \
                  --max-time 60 \
                  --output "$response_file" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer ${GOOGLE_OAUTH_ACCESS_TOKEN}" \
                  --header "Content-Type: application/json" \
                  --data-binary "@${payload_file}" \
                  "https://firebaserules.googleapis.com/v1/projects/game-flow-c6311/rulesets"
              )"
              curl_status="$?"
              set -e

              if (( curl_status == 0 )) && [[ "$http_status" =~ ^2[0-9][0-9]$ ]]; then
                ruleset_name="$(jq -er '.name' "$response_file" 2>/dev/null || true)"
                created_rules_b64="$(
                  jq -er '
                    (.source.files // [])
                    | if length == 1 and .[0].name == "firestore.rules"
                      then (.[0].content | @base64)
                      else error("expected exactly one firestore.rules source file")
                      end
                  ' "$response_file" 2>/dev/null || true
                )"
                created_fingerprint="$(
                  jq -er '
                    (.source.files // [])
                    | if length == 1 and .[0].name == "firestore.rules"
                      then (.[0].fingerprint // "")
                      else error("expected exactly one firestore.rules source file")
                      end
                  ' "$response_file" 2>/dev/null || true
                )"
                if [[ "$ruleset_name" =~ ^projects/game-flow-c6311/rulesets/[A-Za-z0-9_-]+$ ]] \
                  && [[ -n "$created_rules_b64" && "$created_rules_b64" == "$local_rules_b64" ]] \
                  && [[ "$created_fingerprint" == "$local_fingerprint" ]]; then
                  rm -f "$payload_file" "$response_file"
                  printf '%s\n' "$ruleset_name"
                  return 0
                fi
                echo "Firestore Rules API returned a non-matching ruleset; refusing to activate it." >&2
                break
              fi

              firestore_rules_api_error "Firestore ruleset creation" "$curl_status" "$http_status" "$response_file"
              if (( curl_status == 0 )) && [[ ! "$http_status" =~ ^(408|429|500|502|503|504)$ ]]; then
                echo "Firestore ruleset creation failed with non-transient HTTP ${http_status}; not retrying." >&2
                break
              fi
              if (( attempt < 3 )); then
                retry_delay_seconds=$((10 * attempt))
                echo "Transient Firestore ruleset creation failure; retrying in ${retry_delay_seconds}s (attempt $((attempt + 1))/3)." >&2
                sleep "$retry_delay_seconds"
              fi
            done

            rm -f "$payload_file" "$response_file"
            return 1
          }

          ensure_exact_firestore_ruleset() {
            local expected_rules_source="${1:-$final_firestore_rules}"
            local ruleset_name
            if ruleset_name="$(find_recent_matching_firestore_ruleset "$expected_rules_source")"; then
              printf '%s\n' "$ruleset_name"
              return 0
            fi
            if ruleset_name="$(create_firestore_ruleset_with_retry "$expected_rules_source")"; then
              printf '%s\n' "$ruleset_name"
              return 0
            fi
            # A timed-out create may still have committed an immutable ruleset.
            # Recheck exact source before failing; never create or activate by name alone.
            ruleset_name="$(find_recent_matching_firestore_ruleset "$expected_rules_source")" || return 1
            printf '%s\n' "$ruleset_name"
          }

          verify_active_firestore_release_name() {
            local expected_ruleset_name="$1"
            local release_file
            release_file="$(mktemp "$RUNNER_TEMP/firestore-release-verification.XXXXXX.json")"
            if ! curl --silent --show-error --fail \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer ${GOOGLE_OAUTH_ACCESS_TOKEN}" \
              "https://firebaserules.googleapis.com/v1/projects/game-flow-c6311/releases/cloud.firestore" \
              > "$release_file"; then
              rm -f "$release_file"
              return 1
            fi
            if [[ "$(jq -r '.rulesetName // ""' "$release_file")" == "$expected_ruleset_name" ]]; then
              rm -f "$release_file"
              return 0
            fi
            rm -f "$release_file"
            return 1
          }

          activate_firestore_ruleset_with_retry() {
            local ruleset_name="$1"
            local expected_rules_source="${2:-$final_firestore_rules}"
            local payload_file response_file attempt verify_attempt curl_status http_status retry_delay_seconds
            [[ "$ruleset_name" =~ ^projects/game-flow-c6311/rulesets/[A-Za-z0-9_-]+$ ]] || return 1
            payload_file="$(mktemp "$RUNNER_TEMP/firestore-release-patch.XXXXXX.json")"
            response_file="$(mktemp "$RUNNER_TEMP/firestore-release-patch-response.XXXXXX.json")"
            jq -n \
              --arg release_name "projects/game-flow-c6311/releases/cloud.firestore" \
              --arg ruleset_name "$ruleset_name" \
              '{
                release:{
                  name:$release_name,
                  rulesetName:$ruleset_name
                },
                updateMask:"rulesetName"
              }' > "$payload_file"

            for attempt in 1 2 3 4 5; do
              set +e
              http_status="$(
                curl --silent --show-error \
                  --connect-timeout 10 \
                  --max-time 60 \
                  --output "$response_file" \
                  --write-out '%{http_code}' \
                  --request PATCH \
                  --header "Authorization: Bearer ${GOOGLE_OAUTH_ACCESS_TOKEN}" \
                  --header "Content-Type: application/json" \
                  --data-binary "@${payload_file}" \
                  "https://firebaserules.googleapis.com/v1/projects/game-flow-c6311/releases/cloud.firestore"
              )"
              curl_status="$?"
              set -e

              if (( curl_status == 0 )) \
                && [[ "$http_status" =~ ^2[0-9][0-9]$ ]] \
                && [[ "$(jq -r '.rulesetName // ""' "$response_file")" == "$ruleset_name" ]]; then
                for verify_attempt in 1 2 3 4 5; do
                  if verify_active_firestore_release_name "$ruleset_name"; then
                    rm -f "$payload_file" "$response_file"
                    return 0
                  fi
                  if (( verify_attempt < 5 )); then
                    sleep $((5 * verify_attempt))
                  fi
                done
                break
              fi

              firestore_rules_api_error "Firestore release update" "$curl_status" "$http_status" "$response_file"
              if (( curl_status == 0 )) && [[ ! "$http_status" =~ ^(408|409|429|500|502|503|504)$ ]]; then
                break
              fi
              if (( attempt < 5 )); then
                retry_delay_seconds=$((15 * attempt))
                echo "Transient Firestore release update failure; retrying in ${retry_delay_seconds}s (attempt $((attempt + 1))/5)." >&2
                sleep "$retry_delay_seconds"
              fi
            done

            rm -f "$payload_file" "$response_file"
            return 1
          }

          write_firestore_configuration_blocked_summary() {
            local failed_stage="$1"
            {
              echo "### Firestore configuration deploy blocked"
              echo
              echo "| Signal | Result |"
              echo "| --- | --- |"
              echo "| Failed stage | ${failed_stage} |"
              echo '| Guaranteed not deployed | Full `hosting`, `functions` application |'
              echo "| Firestore configuration | Exact rules and indexes were not both verified. |"
              echo
              echo "The full application deployment remains fail-closed. A narrowly targeted compatibility function may already be current."
              echo
              echo "Recovery: follow the [production Firestore deploy retry procedure](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/docs/observability-runbook.md#firestore-rules-api-retry-exhaustion)."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          write_firestore_finalization_blocked_summary() {
            {
              echo "### Firestore server-only finalization blocked"
              echo
              echo "| Signal | Result |"
              echo "| --- | --- |"
              echo '| Application | Updated callable and callers are deployed. |'
              echo '| Transitional rules | Certificate defaults remain owner/admin writable for backward compatibility. |'
              echo '| Final rules | The exact server-only ruleset was not activated. |'
              echo
              echo "No client outage was introduced. Retry this exact release to finish tightening the write boundary."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          retry_firebase_deploy() {
            local deploy_targets="$1"
            local deploy_label="$2"
            local max_attempts="${3:-3}"
            local base_delay_seconds="${4:-15}"
            local acknowledge_failure_policy="${5:-false}"
            local attempt deploy_config deploy_log deploy_status retry_delay_seconds retry_jitter_seconds
            deploy_config="$firebase_config"
            if [[ "$deploy_targets" == "firestore:indexes" ]]; then
              # firebase-tools 14.25 prepares every Firestore rules path present
              # in the config even for --only firestore:indexes. Supplying the
              # derived indexes-only config prevents an unrelated projects:test
              # outage from blocking index deployment after exact rules were
              # already compiled, source-verified, and activated above.
              deploy_config="$firestore_indexes_config"
            fi
            local -a deploy_args=(
              --only "$deploy_targets"
              --project game-flow-c6311
              --config "$deploy_config"
              --non-interactive
            )

            if [[ "$acknowledge_failure_policy" == "true" ]]; then
              if [[ "$deploy_targets" != "$retry_enabled_function_targets" \
                && "$deploy_targets" != "$retry_enabled_inventory_producer_target" \
                && "$deploy_targets" != "$retry_enabled_cleanup_compatibility_target" ]]; then
                echo "Refusing --force outside the reviewed retry-enabled function allowlist." >&2
                return 1
              fi
              deploy_args+=(--force)
            elif [[ "$acknowledge_failure_policy" != "false" ]]; then
              echo "Invalid failure-policy acknowledgement state." >&2
              return 1
            fi

            for ((attempt = 1; attempt <= max_attempts; attempt += 1)); do
              deploy_log="$RUNNER_TEMP/firebase-${deploy_label}-deploy-attempt-${attempt}.log"
              set +e
              (
                cd "$FIREBASE_PRODUCTION_BUNDLE"
                node "$firebase_cli" deploy "${deploy_args[@]}"
              ) 2>&1 | tee "$deploy_log"
              deploy_status="${PIPESTATUS[0]}"
              set -e

              if (( deploy_status == 0 )); then
                return 0
              fi

              if ! grep -Eiq "$transient_pattern" "$deploy_log"; then
                echo "Firebase ${deploy_label} deploy failed with a non-transient error; not retrying." >&2
                return "$deploy_status"
              fi

              if (( attempt == max_attempts )); then
                echo "Firebase ${deploy_label} deploy failed after ${max_attempts} transient attempts." >&2
                return "$deploy_status"
              fi

              retry_delay_seconds=$((base_delay_seconds * (2 ** (attempt - 1))))
              retry_jitter_seconds=$((RANDOM % 16))
              retry_delay_seconds=$((retry_delay_seconds + retry_jitter_seconds))
              if (( retry_delay_seconds > 120 )); then
                retry_delay_seconds=120
              fi
              echo "Transient Firebase ${deploy_label} deploy failure; retrying in ${retry_delay_seconds} seconds (attempt $((attempt + 1))/${max_attempts})." >&2
              sleep "$retry_delay_seconds"
            done
          }

          record_component_deployment() {
            local component_environment="$1"
            local component_description="$2"
            local attempt deployment_id deployment_status

            for attempt in 1 2 3; do
              deployment_id="$(
                jq -n \
                  --arg ref "$GITHUB_SHA" \
                  --arg environment "$component_environment" \
                  '{
                    ref: $ref,
                    environment: $environment,
                    auto_merge: false,
                    required_contexts: [],
                    transient_environment: false,
                    production_environment: true,
                    description: "Component deployment marker"
                  }' \
                  | gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id'
              )" || deployment_id=""

              if [[ "$deployment_id" =~ ^[0-9]+$ ]]; then
                deployment_status="$(
                  jq -n \
                    --arg description "$component_description" \
                    --arg environment "$component_environment" \
                    --arg log_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                    '{
                      state: "success",
                      description: $description,
                      environment: $environment,
                      log_url: $log_url,
                      auto_inactive: true
                    }' \
                    | gh api --method POST \
                      "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                      --input - \
                      --jq '.state'
                )" || deployment_status=""
                if [[ "$deployment_status" == "success" ]]; then
                  return 0
                fi
              fi

              if (( attempt < 3 )); then
                sleep $((5 * attempt))
              fi
            done

            echo "Unable to record the ${component_environment} deployment marker." >&2
            return 1
          }

          if [[ "$native_callable_ready" == "true" \
            && "$CERTIFICATE_DEFAULTS_LOCKDOWN_NEEDED" == "true" ]]; then
            # A protected readiness change is external to git. Force the rules
            # branch on workflow_dispatch so the compatibility marker can be
            # finalized without requiring an unrelated source change.
            FIRESTORE_CONFIG_CHANGED="true"
          fi
          # The full Functions deploy does not guarantee per-function update order.
          # Install the durable legacy binding producer and the revalidating
          # superset consumer before the V2 backfill revokes stale bindings, then
          # run that backfill before any current or future writer can emit a new
          # certificate-signature tombstone schema.
          retry_firebase_deploy \
            "$retry_enabled_inventory_producer_target" \
            "certificate-signature-inventory-producer" \
            3 \
            15 \
            true
          retry_firebase_deploy \
            "$retry_enabled_cleanup_compatibility_target" \
            "certificate-signature-cleanup-compatibility" \
            3 \
            15 \
            true
          node "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-certificate-legacy-signature-inventory.mjs" --apply
          if [[ "$FIRESTORE_CONFIG_CHANGED" == "true" ]]; then
            # Most authorization changes publish before their callers. Certificate
            # defaults are a compatibility migration: deploy the server writer,
            # activate an otherwise-exact transitional ruleset, publish every new
            # caller, and remove the legacy direct-write path only after supported
            # installed native versions are proven to use the callable.
            active_rules_variant=""
            if verify_active_firestore_rules "$final_firestore_rules"; then
              active_rules_variant="current-final"
            else
              active_rules_status="$?"
              if (( active_rules_status == 2 )); then
                write_firestore_configuration_blocked_summary "active Firestore rules could not be read"
                exit 2
              fi
            fi
            if [[ -z "$active_rules_variant" ]]; then
              if verify_active_firestore_rules "$compatibility_firestore_rules"; then
                if [[ "$baseline_firestore_mode" == "final" ]]; then
                  active_rules_variant="baseline-final"
                else
                  active_rules_variant="current-compatibility"
                fi
              else
                active_rules_status="$?"
                if (( active_rules_status == 2 )); then
                  write_firestore_configuration_blocked_summary "active Firestore rules could not be read"
                  exit 2
                fi
              fi
            fi
            if [[ -z "$active_rules_variant" ]]; then
              if verify_active_firestore_rules "$baseline_firestore_rules"; then
                if [[ "$baseline_firestore_mode" == "ambiguous" ]]; then
                  active_rules_variant="baseline-final"
                else
                  active_rules_variant="baseline-${baseline_firestore_mode}"
                fi
              else
                active_rules_status="$?"
                if (( active_rules_status == 2 )); then
                  write_firestore_configuration_blocked_summary "active Firestore rules could not be read"
                  exit 2
                fi
              fi
            fi
            if [[ -z "$active_rules_variant" ]]; then
              if verify_active_firestore_rules "$baseline_compatibility_firestore_rules"; then
                if [[ "$baseline_firestore_mode" == "final" ]]; then
                  # A trusted final marker means a matching compatibility source is
                  # unexpected drift. Restore the final boundary; never treat it as
                  # permission to reopen legacy writes.
                  active_rules_variant="baseline-final"
                else
                  active_rules_variant="baseline-compatibility"
                fi
              else
                active_rules_status="$?"
                if (( active_rules_status == 2 )); then
                  write_firestore_configuration_blocked_summary "active Firestore rules could not be read"
                  exit 2
                fi
              fi
            fi
            if [[ -z "$active_rules_variant" ]]; then
              write_firestore_configuration_blocked_summary "active Firestore rules did not match a trusted final or compatibility baseline"
              exit 2
            fi

            if [[ "$active_rules_variant" == "current-final" ]]; then
              firestore_component_description="Firestore rules and indexes are current at ${GITHUB_SHA}."
              echo "::notice::The active Firestore rules exactly match this commit; skipping a redundant ruleset write."
            elif [[ "$active_rules_variant" == *-final ]]; then
              # Once the server-only boundary has been established, a later
              # configuration change must preserve it even if the native-ready
              # flag is subsequently unset.
              if ! final_ruleset_name="$(ensure_exact_firestore_ruleset "$final_firestore_rules")"; then
                write_firestore_configuration_blocked_summary "immutable ruleset creation and exact-source verification"
                exit 2
              fi
              if ! activate_firestore_ruleset_with_retry "$final_ruleset_name" "$final_firestore_rules"; then
                write_firestore_configuration_blocked_summary "exact ruleset release activation"
                exit 2
              fi
              firestore_component_description="Firestore rules and indexes are current at ${GITHUB_SHA}."
              echo "::notice::Created or reused and activated the exact staged Firestore ruleset."
            else
              retry_firebase_deploy \
                "functions:commitCertificateDefaults" \
                "certificate-defaults-writer-compatibility" \
                3 \
                15
              if [[ "$active_rules_variant" != "current-compatibility" ]]; then
                # The documented RuleSet create endpoint compiles each source and
                # rejects syntax or semantic errors. Avoid Firebase CLI's separate,
                # currently unavailable projects:test request, verify every returned
                # immutable source byte-for-byte, then update only rulesetName.
                if ! compatibility_ruleset_name="$(ensure_exact_firestore_ruleset "$compatibility_firestore_rules")"; then
                  write_firestore_configuration_blocked_summary "compatibility ruleset creation and exact-source verification"
                  exit 2
                fi
                if ! activate_firestore_ruleset_with_retry "$compatibility_ruleset_name" "$compatibility_firestore_rules"; then
                  write_firestore_configuration_blocked_summary "compatibility ruleset release activation"
                  exit 2
                fi
                echo "::notice::certificate-defaults-rules-compatibility is active."
              fi
              if [[ "$native_callable_ready" == "true" ]]; then
                if ! final_ruleset_name="$(ensure_exact_firestore_ruleset "$final_firestore_rules")"; then
                  write_firestore_configuration_blocked_summary "final ruleset creation and exact-source verification"
                  exit 2
                fi
                finalize_firestore_rules="true"
              else
                firestore_component_description="Firestore compatibility rules at ${GITHUB_SHA}; packaged native clients still use direct writes."
                echo "::notice::Keeping certificate-defaults compatibility rules until supported installed native versions use the callable."
              fi
            fi
            if ! retry_firebase_deploy "firestore:indexes" "firestore-indexes" 3 15; then
              write_firestore_configuration_blocked_summary "Firestore index deployment"
              exit 2
            fi
          else
            # No authorization/index drift exists relative to the last successful
            # production deployment. Do not make a redundant Rules API write: an
            # unrelated Rules API outage must not fail a Hosting/Functions-only fix.
            :
          fi
          # A transitional ruleset is not the exact component and must never earn
          # the exact-SHA marker. Otherwise record immediately so a later unrelated
          # application failure does not force a redundant rules deployment.
          if [[ "$finalize_firestore_rules" != "true" ]]; then
            if ! record_component_deployment \
              "production-firestore" \
              "$firestore_component_description"; then
              echo "::warning::Firestore is current, but its component marker could not be recorded. A future failed production retry may conservatively redeploy it."
            fi
          fi

          # These event handlers intentionally enable automatic retries and have
          # deterministic-write, retry-anchor, or convergence coverage. A targeted
          # --force acknowledges only their reviewed failure policies; the
          # subsequent full-fleet deploy remains unforced so deletions and unsafe
          # trigger migrations still fail closed.
          retry_firebase_deploy \
            "$retry_enabled_function_targets" \
            "retry-enabled-functions" \
            3 \
            15 \
            true
          if [[ "$TEAM_FEE_CHECKOUT_BACKFILL_NEEDED" == "true" || "$REGISTRATION_CHECKOUT_BACKFILL_NEEDED" == "true" ]]; then
            # Publish every producer/consumer of the private attempt state first,
            # then atomically move and scrub historical bearer data before the
            # rest of Hosting and Functions becomes visible.
            retry_firebase_deploy \
              "functions:createStripeTeamFeeCheckout,functions:createStripeRegistrationCheckout,functions:cancelStripeRegistrationCheckout,functions:queueDueRegistrationFailedPaymentReminders,functions:stripeTeamPassWebhook" \
              "checkout-migration-compatibility" \
              3 \
              15
          fi
          if [[ "$TEAM_FEE_CHECKOUT_BACKFILL_NEEDED" == "true" ]]; then
            node "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-team-fee-checkout-attempts.mjs" --apply
          fi
          if [[ "$REGISTRATION_CHECKOUT_BACKFILL_NEEDED" == "true" ]]; then
            node "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-registration-checkout-attempts.mjs" --apply
          fi
          retry_firebase_deploy "hosting,functions" "application"

          if [[ "$finalize_firestore_rules" == "true" ]]; then
            if ! activate_firestore_ruleset_with_retry "$final_ruleset_name" "$final_firestore_rules"; then
              write_firestore_finalization_blocked_summary
              exit 2
            fi
            echo "::notice::certificate-defaults-rules-final is active."
            firestore_component_description="Firestore rules and indexes are current at ${GITHUB_SHA}."
            if ! record_component_deployment \
              "production-firestore" \
              "$firestore_component_description"; then
              echo "::warning::Firestore is current, but its component marker could not be recorded. A future failed production retry may conservatively redeploy it."
            fi
          fi

          if [[ "$ADMIN_USER_SEARCH_BACKFILL_NEEDED" == "true" ]]; then
            node "$FIREBASE_PRODUCTION_BUNDLE/_migration/backfill-admin-user-search-index.mjs" --apply
          fi

      - name: Record Firebase component deployment markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          record_component() {
            local environment="$1"
            local description="$2"
            local deployment_id
            deployment_id="$(
              jq -n \
                --arg ref "$GITHUB_SHA" \
                --arg environment "$environment" \
                '{
                  ref:$ref,
                  environment:$environment,
                  auto_merge:false,
                  required_contexts:[],
                  transient_environment:false,
                  production_environment:true,
                  description:"Release-train component marker"
                }' \
                | gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id'
            )"
            jq -n \
              --arg description "$description" \
              --arg environment "$environment" \
              --arg log_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              '{
                state:"success",
                description:$description,
                environment:$environment,
                log_url:$log_url,
                auto_inactive:true
              }' \
              | gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                --input - \
                --jq '.state' \
                | grep -Fxq success
          }
          record_component production-storage "Storage authorization is current at ${GITHUB_SHA}."
          record_component production-functions "Firebase Functions are current at ${GITHUB_SHA}."
          record_component production-firebase-hosting "Firebase Hosting is current at ${GITHUB_SHA}."

      - name: Remove production deploy credential
        if: always()
        env:
          GOOGLE_CREDENTIAL_FILE: ${{ steps.google_auth_production.outputs.credentials_file_path }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_CREDENTIAL_FILE" ]]; then
            rm -f -- "$GOOGLE_CREDENTIAL_FILE"
          fi
          {
            echo "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="
            echo "GOOGLE_APPLICATION_CREDENTIALS="
            echo "GOOGLE_GHA_CREDS_PATH="
          } >> "$GITHUB_ENV"

  deploy-pages:
    if: vars.RELEASE_GITHUB_PAGES_DEPLOY_ENABLED == 'true'
    needs: [prepare-deploy, deploy]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - name: Download exact-SHA production handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: firebase-production-trusted-ready
          path: ${{ runner.temp }}/firebase-production-ready

      - name: Validate Pages handoff identity
        env:
          EXPECTED_APP_CHECK_ENFORCEMENT_READY: ${{ vars.APP_CHECK_ENFORCEMENT_READY }}
          EXPECTED_APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_RECAPTCHA_ENTERPRISE_SITE_KEY }}
          PREPARED_HEAD_SHA: ${{ needs.prepare-deploy.outputs.head_sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/firebase-production-ready"
          runtime_config="$bundle/site/.well-known/allplays-runtime-config.json"
          [[ "$PREPARED_HEAD_SHA" == "$GITHUB_SHA" ]]
          grep -Fxq "$GITHUB_SHA" "$bundle/head-sha"
          test -f "$bundle/site/index.html"
          test -f "$bundle/site/app/index.html"
          test -f "$bundle/site/.nojekyll"
          case "${EXPECTED_APP_CHECK_ENFORCEMENT_READY,,}" in
            true|1)
              [[ "$EXPECTED_APP_CHECK_SITE_KEY" =~ ^[A-Za-z0-9_-]{10,200}$ ]]
              jq -e \
                --arg expected_site_key "$EXPECTED_APP_CHECK_SITE_KEY" \
                '.appCheck.enabled == true
                 and .appCheck.isTokenAutoRefreshEnabled == true
                 and .appCheck.recaptchaEnterpriseSiteKey == $expected_site_key
                 and (.appCheck | has("debugToken") | not)' \
                "$runtime_config" >/dev/null
              ;;
            *)
              jq -e \
                '.appCheck.enabled == false
                 and .appCheck.isTokenAutoRefreshEnabled == true
                 and (.appCheck | has("recaptchaEnterpriseSiteKey") | not)
                 and (.appCheck | has("debugToken") | not)' \
                "$runtime_config" >/dev/null
              ;;
          esac

      - name: Upload exact-SHA Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/firebase-production-ready/site

      - name: Deploy exact-SHA Pages artifact
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release-marker:
    if: >-
      always() &&
      needs.deploy.result == 'success' &&
      (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped')
    needs: [deploy, deploy-pages]
    runs-on: ubuntu-latest
    permissions:
      deployments: write

    steps:
      - name: Record complete release marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deployment_id="$(
            jq -n \
              --arg ref "$GITHUB_SHA" \
              '{
                ref:$ref,
                environment:"production-release",
                auto_merge:false,
                required_contexts:[],
                transient_environment:false,
                production_environment:true,
                description:"Complete serialized production release"
              }' \
              | gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id'
          )"
          jq -n \
            --arg log_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{
              state:"success",
              description:"All enabled production components reached the exact release SHA.",
              environment:"production-release",
              log_url:$log_url,
              auto_inactive:true
            }' \
            | gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
              --input - \
              --jq '.state' \
              | grep -Fxq success
