name: post-deploy-smoke

on:
  workflow_run:
    workflows:
      - deploy-prod
    types:
      - completed

permissions:
  contents: read
  deployments: read

concurrency:
  group: post-deploy-smoke-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  post-deploy-smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-smoke

    steps:
      - name: Verify complete exact-SHA release marker
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          deployment_ids="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments" \
              -f environment=production-release \
              -f sha="$RELEASE_SHA" \
              -F per_page=20 \
              --jq '.[].id'
          )"
          [[ -n "$deployment_ids" ]]
          release_current=false
          while IFS= read -r deployment_id; do
            [[ "$deployment_id" =~ ^[0-9]+$ ]] || continue
            state="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                -F per_page=1 \
                --jq '.[0].state // ""'
            )"
            if [[ "$state" == "success" ]]; then
              release_current=true
              break
            fi
          done <<<"$deployment_ids"
          [[ "$release_current" == "true" ]]

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify candidate response headers
        id: firebase_public
        continue-on-error: true
        run: node scripts/verify-response-headers.mjs https://game-flow-c6311.web.app

      - name: Verify authenticated candidate host
        id: firebase_auth
        continue-on-error: true
        run: npx playwright test tests/smoke/candidate-host-auth.spec.js --config=playwright.smoke.config.js --reporter=line
        env:
          CANDIDATE_HOST_URL: https://game-flow-c6311.web.app
          SMOKE_AUTH_EMAIL: ${{ secrets.SMOKE_AUTH_EMAIL }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}

      - name: Run production smoke
        id: canonical_prod
        continue-on-error: true
        run: npx playwright test --config=playwright.smoke.config.js --reporter=line
        env:
          SMOKE_BASE_URL: https://allplays.ai
          SMOKE_APP_BOOT_URL: https://allplays.ai/app/
          SMOKE_SUITE: production
          SMOKE_TEAM_ID: ${{ vars.SMOKE_TEAM_ID }}
          SMOKE_GAME_ID: ${{ vars.SMOKE_GAME_ID }}
          SMOKE_PLAYER_ID: ${{ vars.SMOKE_PLAYER_ID }}
          SMOKE_AUTH_EMAIL: ${{ secrets.SMOKE_AUTH_EMAIL }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}

      - name: Upload redacted candidate authentication diagnostic
        if: always() && steps.firebase_auth.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-auth-redacted-diagnostic-${{ github.event.workflow_run.head_sha }}
          path: test-results/**/candidate-auth-diagnostic.json
          if-no-files-found: warn
          retention-days: 7

      - name: Aggregate production smoke signals
        if: always()
        env:
          CANONICAL_PROD_OUTCOME: ${{ steps.canonical_prod.outcome }}
          FIREBASE_AUTH_OUTCOME: ${{ steps.firebase_auth.outcome }}
          FIREBASE_PUBLIC_OUTCOME: ${{ steps.firebase_public.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Post-deploy production signals"
            echo
            echo "| Probe | Outcome |"
            echo "| --- | --- |"
            echo "| Firebase public origin | $FIREBASE_PUBLIC_OUTCOME |"
            echo "| Firebase authenticated login | $FIREBASE_AUTH_OUTCOME |"
            echo "| Canonical production | $CANONICAL_PROD_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FIREBASE_PUBLIC_OUTCOME" != "success" ||
                "$FIREBASE_AUTH_OUTCOME" != "success" ||
                "$CANONICAL_PROD_OUTCOME" != "success" ]]; then
            echo "One or more independent post-deploy signals failed." >&2
            exit 1
          fi
